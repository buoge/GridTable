<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Layout Local Demo</title>
    <style>
      :root {
        --border: #d8dde6;
        --border-strong: #aeb8c8;
        --bg: #f6f8fb;
        --panel: #ffffff;
        --text: #202733;
        --muted: #647084;
        --primary: #2563eb;
        --primary-soft: #dbeafe;
        --danger: #dc2626;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--text);
        background: var(--bg);
        font-family: Arial, Helvetica, sans-serif;
      }

      .app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 16px;
        min-height: 100vh;
        padding: 16px;
      }

      .workspace,
      .inspector {
        min-width: 0;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .workspace {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .toolbar,
      .inspector-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px;
        border-bottom: 1px solid var(--border);
      }

      .toolbar {
        flex-wrap: wrap;
      }

      .toolbar-spacer {
        flex: 1;
      }

      button,
      select {
        height: 32px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        background: #fff;
        color: var(--text);
        font-size: 13px;
        cursor: pointer;
      }

      button {
        padding: 0 10px;
      }

      button.primary {
        border-color: var(--primary);
        background: var(--primary);
        color: #fff;
      }

      button.danger {
        border-color: #fecaca;
        color: var(--danger);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .status {
        color: var(--muted);
        font-size: 13px;
      }

      .canvas {
        overflow: auto;
        padding: 16px;
      }

      .grid-title {
        margin: 0 0 10px;
        font-size: 18px;
        font-weight: 700;
      }

      .grid-table {
        display: inline-grid;
        border-top: 1px solid var(--border-strong);
        border-left: 1px solid var(--border-strong);
        background: #fff;
      }

      .grid-header,
      .grid-cell {
        position: relative;
        min-height: 48px;
        border-right: 1px solid var(--border-strong);
        border-bottom: 1px solid var(--border-strong);
      }

      .grid-header {
        min-height: 40px;
        background: #f0f4fa;
      }

      .grid-header input {
        width: 100%;
        height: 100%;
        border: 0;
        padding: 0 10px;
        background: transparent;
        color: var(--text);
        font-weight: 700;
        outline: 0;
      }

      .grid-cell {
        display: flex;
        align-items: stretch;
        justify-content: stretch;
        padding: 6px;
      }

      .grid-cell.selected {
        outline: 2px solid var(--primary);
        outline-offset: -2px;
      }

      .grid-cell.covered {
        display: none;
      }

      .mock-field {
        width: 100%;
        min-height: 36px;
        padding: 7px 8px;
        border: 1px solid #dbe3ef;
        border-radius: 6px;
        background: #fff;
      }

      .mock-field-label {
        margin-bottom: 2px;
        color: var(--muted);
        font-size: 11px;
      }

      .mock-field-value {
        font-size: 13px;
        line-height: 18px;
      }

      .empty-cell {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 36px;
        border: 1px dashed #cbd5e1;
        border-radius: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      .inspector {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .inspector-header {
        font-weight: 700;
      }

      .panel {
        padding: 12px;
        border-bottom: 1px solid var(--border);
      }

      .panel-title {
        margin: 0 0 10px;
        font-size: 14px;
        font-weight: 700;
      }

      .field-palette {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .field-palette button {
        width: 100%;
      }

      .color-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .color-button {
        width: 28px;
        height: 28px;
        padding: 0;
        border-radius: 50%;
      }

      textarea {
        width: 100%;
        min-height: 260px;
        resize: vertical;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px;
        color: var(--text);
        font-family: Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 18px;
      }

      .json-actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }

      @media (max-width: 960px) {
        .app {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="workspace">
        <div class="toolbar">
          <button id="addRow">Add row</button>
          <button id="deleteRow" class="danger">Delete row</button>
          <button id="addColumn">Add column</button>
          <button id="deleteColumn" class="danger">Delete column</button>
          <button id="mergeCells">Merge selection</button>
          <button id="unmergeCell">Unmerge cell</button>
          <div class="toolbar-spacer"></div>
          <button id="resetDemo">Reset mock data</button>
          <span id="selectionStatus" class="status">No cell selected</span>
        </div>
        <div class="canvas">
          <h1 id="gridLabel" class="grid-title"></h1>
          <div id="gridTable" class="grid-table"></div>
        </div>
      </section>

      <aside class="inspector">
        <div class="inspector-header">Local Mock Controls</div>
        <div class="panel">
          <p class="panel-title">Add mock field to selected cell</p>
          <div class="field-palette">
            <button data-field-type="text">Text</button>
            <button data-field-type="number">Number</button>
            <button data-field-type="select">Select</button>
            <button data-field-type="date">Date</button>
          </div>
        </div>
        <div class="panel">
          <p class="panel-title">Cell background</p>
          <div id="colorRow" class="color-row"></div>
        </div>
        <div class="panel">
          <p class="panel-title">Schema JSON</p>
          <textarea id="schemaJson" spellcheck="false"></textarea>
          <div class="json-actions">
            <button id="applyJson" class="primary">Apply JSON</button>
            <button id="copyJson">Copy JSON</button>
          </div>
        </div>
      </aside>
    </main>

    <script>
      const defaultGrid = {
        label: 'Grid Layout',
        showColumnHeader: true,
        columnWidths: [220, 220, 220],
        rowNum: 3,
        headerLabels: ['Name', 'Status', 'Due date'],
        cells: {
          '0:0': { fieldIds: ['field-name'], backgroundColor: '#fff6d8' },
          '0:1': { fieldIds: ['field-status'] },
          '0:2': { fieldIds: ['field-date'] },
          '1:0': { fieldIds: ['field-note'], colSpan: 2, backgroundColor: '#e5f2ff' },
        },
        fields: {
          'field-name': { id: 'field-name', type: 'text', label: 'Name', value: 'Door frame inspection' },
          'field-status': {
            id: 'field-status',
            type: 'select',
            label: 'Status',
            value: 'Open',
            options: ['Open', 'Closed'],
          },
          'field-date': { id: 'field-date', type: 'date', label: 'Due date', value: '2026-06-30' },
          'field-note': { id: 'field-note', type: 'text', label: 'Note', value: 'Merged mock cell' },
        },
      };

      const colors = [
        { label: 'Default', value: '', preview: '#ffffff' },
        { label: 'Gray', value: '#f0efec', preview: '#f0efec' },
        { label: 'Yellow', value: '#fff6d8', preview: '#fff6d8' },
        { label: 'Green', value: '#e8f3ec', preview: '#e8f3ec' },
        { label: 'Blue', value: '#e5f2ff', preview: '#e5f2ff' },
        { label: 'Pink', value: '#fbecf2', preview: '#fbecf2' },
      ];

      let grid = clone(defaultGrid);
      let selectedSlots = [];
      let fieldCounter = 1;

      const gridEl = document.getElementById('gridTable');
      const labelEl = document.getElementById('gridLabel');
      const schemaJsonEl = document.getElementById('schemaJson');
      const statusEl = document.getElementById('selectionStatus');

      function clone(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function getColumnCount() {
        return grid.columnWidths.length;
      }

      function getSlot(row, column) {
        return row * getColumnCount() + column;
      }

      function getKey(row, column) {
        return `${row}:${column}`;
      }

      function getKeyFromSlot(slot) {
        const columnCount = getColumnCount();
        return `${Math.floor(slot / columnCount)}:${slot % columnCount}`;
      }

      function getCellFromSlot(slot) {
        return grid.cells[getKeyFromSlot(slot)] || {};
      }

      function getCoveredSlots() {
        const covered = new Set();
        Object.entries(grid.cells).forEach(([key, cell]) => {
          const [row, column] = key.split(':').map(Number);
          const colSpan = Number(cell.colSpan) || 1;
          const rowSpan = Number(cell.rowSpan) || 1;
          for (let rowOffset = 0; rowOffset < rowSpan; rowOffset += 1) {
            for (let colOffset = 0; colOffset < colSpan; colOffset += 1) {
              if (rowOffset === 0 && colOffset === 0) continue;
              covered.add(getSlot(row + rowOffset, column + colOffset));
            }
          }
        });
        return covered;
      }

      function normalizeCells() {
        const columnCount = getColumnCount();
        const maxSlots = grid.rowNum * columnCount;
        Object.keys(grid.cells).forEach(key => {
          const [row, column] = key.split(':').map(Number);
          const slot = getSlot(row, column);
          if (row >= grid.rowNum || column >= columnCount || slot >= maxSlots) {
            delete grid.cells[key];
            return;
          }
          const cell = grid.cells[key];
          if (!cell.fieldIds || !cell.fieldIds.length) delete cell.fieldIds;
          if (!cell.backgroundColor) delete cell.backgroundColor;
          if ((Number(cell.colSpan) || 1) <= 1) delete cell.colSpan;
          if ((Number(cell.rowSpan) || 1) <= 1) delete cell.rowSpan;
          if (!Object.keys(cell).length) delete grid.cells[key];
        });
      }

      function render() {
        normalizeCells();
        labelEl.textContent = grid.label || 'Grid Layout';
        const columnTemplate = grid.columnWidths.map(width => `${Number(width) || 220}px`).join(' ');
        const rows = grid.showColumnHeader ? grid.rowNum + 1 : grid.rowNum;
        gridEl.style.gridTemplateColumns = columnTemplate;
        gridEl.style.gridTemplateRows = `repeat(${rows}, auto)`;
        gridEl.innerHTML = '';

        if (grid.showColumnHeader) {
          grid.headerLabels = Array.from({ length: getColumnCount() }, (_, index) => {
            return grid.headerLabels[index] || `Column ${index + 1}`;
          });
          grid.headerLabels.forEach((label, columnIndex) => {
            const header = document.createElement('div');
            header.className = 'grid-header';
            const input = document.createElement('input');
            input.value = label;
            input.addEventListener('input', event => {
              grid.headerLabels[columnIndex] = event.target.value;
              syncJson();
            });
            header.appendChild(input);
            gridEl.appendChild(header);
          });
        }

        const coveredSlots = getCoveredSlots();
        for (let row = 0; row < grid.rowNum; row += 1) {
          for (let column = 0; column < getColumnCount(); column += 1) {
            const slot = getSlot(row, column);
            if (coveredSlots.has(slot)) continue;
            const key = getKey(row, column);
            const cell = grid.cells[key] || {};
            const cellEl = document.createElement('button');
            cellEl.type = 'button';
            cellEl.className = 'grid-cell';
            cellEl.style.background = cell.backgroundColor || '#fff';
            if (selectedSlots.includes(slot)) cellEl.classList.add('selected');
            if (cell.colSpan) cellEl.style.gridColumn = `span ${cell.colSpan}`;
            if (cell.rowSpan) cellEl.style.gridRow = `span ${cell.rowSpan}`;
            cellEl.addEventListener('click', event => selectCell(slot, event));
            cellEl.appendChild(renderCellContent(cell));
            gridEl.appendChild(cellEl);
          }
        }

        syncStatus();
        syncJson();
      }

      function renderCellContent(cell) {
        const fieldId = cell.fieldIds && cell.fieldIds[0];
        const field = fieldId ? grid.fields[fieldId] : null;
        if (!field) {
          const empty = document.createElement('div');
          empty.className = 'empty-cell';
          empty.textContent = 'Empty cell';
          return empty;
        }

        const wrapper = document.createElement('div');
        wrapper.className = 'mock-field';
        const label = document.createElement('div');
        label.className = 'mock-field-label';
        label.textContent = `${field.label} · ${field.type}`;
        const value = document.createElement('div');
        value.className = 'mock-field-value';
        value.textContent = field.value || '';
        wrapper.append(label, value);
        return wrapper;
      }

      function selectCell(slot, event) {
        if (event.shiftKey && selectedSlots.length) {
          const start = selectedSlots[0];
          const end = slot;
          selectedSlots = getRangeSlots(start, end);
        } else if (event.metaKey || event.ctrlKey) {
          selectedSlots = selectedSlots.includes(slot)
            ? selectedSlots.filter(item => item !== slot)
            : [...selectedSlots, slot].sort((left, right) => left - right);
        } else {
          selectedSlots = [slot];
        }
        render();
      }

      function getRangeSlots(start, end) {
        const columnCount = getColumnCount();
        const startRow = Math.floor(start / columnCount);
        const startColumn = start % columnCount;
        const endRow = Math.floor(end / columnCount);
        const endColumn = end % columnCount;
        const minRow = Math.min(startRow, endRow);
        const maxRow = Math.max(startRow, endRow);
        const minColumn = Math.min(startColumn, endColumn);
        const maxColumn = Math.max(startColumn, endColumn);
        const slots = [];
        for (let row = minRow; row <= maxRow; row += 1) {
          for (let column = minColumn; column <= maxColumn; column += 1) {
            slots.push(getSlot(row, column));
          }
        }
        return slots;
      }

      function syncStatus() {
        if (!selectedSlots.length) {
          statusEl.textContent = 'No cell selected';
          return;
        }
        const labels = selectedSlots.map(slot => getKeyFromSlot(slot));
        statusEl.textContent = `Selected ${labels.join(', ')}`;
      }

      function syncJson() {
        schemaJsonEl.value = JSON.stringify(grid, null, 2);
      }

      function addRow() {
        grid.rowNum += 1;
        render();
      }

      function deleteRow() {
        if (!selectedSlots.length || grid.rowNum <= 1) return;
        const rowIndex = Math.floor(selectedSlots[0] / getColumnCount());
        const nextCells = {};
        Object.entries(grid.cells).forEach(([key, cell]) => {
          const [row, column] = key.split(':').map(Number);
          if (row < rowIndex) nextCells[key] = cell;
          if (row > rowIndex) nextCells[getKey(row - 1, column)] = cell;
        });
        grid.cells = nextCells;
        grid.rowNum -= 1;
        selectedSlots = [];
        render();
      }

      function addColumn() {
        const insertAt = selectedSlots.length ? selectedSlots[0] % getColumnCount() + 1 : getColumnCount();
        const oldColumnCount = getColumnCount();
        grid.columnWidths.splice(insertAt, 0, 220);
        grid.headerLabels.splice(insertAt, 0, `Column ${insertAt + 1}`);
        const nextCells = {};
        Object.entries(grid.cells).forEach(([key, cell]) => {
          const [row, column] = key.split(':').map(Number);
          const nextColumn = column >= insertAt ? column + 1 : column;
          nextCells[getKey(row, nextColumn)] = cell;
        });
        grid.cells = nextCells;
        selectedSlots = [insertAt < oldColumnCount ? insertAt : oldColumnCount];
        render();
      }

      function deleteColumn() {
        if (!selectedSlots.length || getColumnCount() <= 1) return;
        const deleteIndex = selectedSlots[0] % getColumnCount();
        grid.columnWidths.splice(deleteIndex, 1);
        grid.headerLabels.splice(deleteIndex, 1);
        const nextCells = {};
        Object.entries(grid.cells).forEach(([key, cell]) => {
          const [row, column] = key.split(':').map(Number);
          if (column < deleteIndex) nextCells[key] = cell;
          if (column > deleteIndex) nextCells[getKey(row, column - 1)] = cell;
        });
        grid.cells = nextCells;
        selectedSlots = [];
        render();
      }

      function mergeSelection() {
        if (selectedSlots.length < 2) return;
        const columnCount = getColumnCount();
        const rows = selectedSlots.map(slot => Math.floor(slot / columnCount));
        const columns = selectedSlots.map(slot => slot % columnCount);
        const minRow = Math.min(...rows);
        const maxRow = Math.max(...rows);
        const minColumn = Math.min(...columns);
        const maxColumn = Math.max(...columns);
        const expectedCount = (maxRow - minRow + 1) * (maxColumn - minColumn + 1);
        if (expectedCount !== selectedSlots.length) {
          alert('Select a rectangular range before merging.');
          return;
        }
        const startKey = getKey(minRow, minColumn);
        const firstCell = clone(grid.cells[startKey] || {});
        selectedSlots.forEach(slot => {
          delete grid.cells[getKeyFromSlot(slot)];
        });
        grid.cells[startKey] = {
          ...firstCell,
          colSpan: maxColumn - minColumn + 1,
          rowSpan: maxRow - minRow + 1,
        };
        selectedSlots = [getSlot(minRow, minColumn)];
        render();
      }

      function unmergeCell() {
        if (!selectedSlots.length) return;
        const key = getKeyFromSlot(selectedSlots[0]);
        if (!grid.cells[key]) return;
        delete grid.cells[key].colSpan;
        delete grid.cells[key].rowSpan;
        render();
      }

      function addMockField(type) {
        if (!selectedSlots.length) return;
        const slot = selectedSlots[0];
        const key = getKeyFromSlot(slot);
        const id = `mock-field-${fieldCounter}`;
        fieldCounter += 1;
        const valueByType = {
          text: 'Mock text',
          number: '42',
          select: 'Open',
          date: '2026-06-12',
        };
        grid.fields[id] = {
          id,
          type,
          label: `${type[0].toUpperCase()}${type.slice(1)} field`,
          value: valueByType[type] || 'Mock value',
        };
        grid.cells[key] = {
          ...(grid.cells[key] || {}),
          fieldIds: [id],
        };
        render();
      }

      function setBackground(value) {
        if (!selectedSlots.length) return;
        selectedSlots.forEach(slot => {
          const key = getKeyFromSlot(slot);
          grid.cells[key] = grid.cells[key] || {};
          if (value) {
            grid.cells[key].backgroundColor = value;
          } else {
            delete grid.cells[key].backgroundColor;
          }
        });
        render();
      }

      function renderColors() {
        const row = document.getElementById('colorRow');
        colors.forEach(color => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'color-button';
          button.title = color.label;
          button.style.background = color.preview;
          button.addEventListener('click', () => setBackground(color.value));
          row.appendChild(button);
        });
      }

      document.getElementById('addRow').addEventListener('click', addRow);
      document.getElementById('deleteRow').addEventListener('click', deleteRow);
      document.getElementById('addColumn').addEventListener('click', addColumn);
      document.getElementById('deleteColumn').addEventListener('click', deleteColumn);
      document.getElementById('mergeCells').addEventListener('click', mergeSelection);
      document.getElementById('unmergeCell').addEventListener('click', unmergeCell);
      document.getElementById('resetDemo').addEventListener('click', () => {
        grid = clone(defaultGrid);
        selectedSlots = [];
        render();
      });
      document.getElementById('applyJson').addEventListener('click', () => {
        try {
          grid = JSON.parse(schemaJsonEl.value);
          selectedSlots = [];
          render();
        } catch (error) {
          alert(`Invalid JSON: ${error.message}`);
        }
      });
      document.getElementById('copyJson').addEventListener('click', async () => {
        await navigator.clipboard.writeText(schemaJsonEl.value);
      });
      document.querySelectorAll('[data-field-type]').forEach(button => {
        button.addEventListener('click', () => addMockField(button.dataset.fieldType));
      });

      renderColors();
      render();
    </script>
  </body>
</html>
